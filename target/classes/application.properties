# SEPA Generator Application Configuration

# Server Configuration
server.port=8082
server.servlet.context-path=/

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# SEPA Configuration
sepa.jpmc-client-id=862759
sepa.debtor-currency=EUR
sepa.scheme-name=JPMCOID
sepa.xml-root=<Document xmlns="urn:iso:std:iso:20022:tech:xsd:pain.001.001.03" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">

# Logging Configuration
logging.level.com.bfsi.jpmc=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
