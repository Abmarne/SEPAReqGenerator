<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEPA Request Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #555;
            margin-left: 10px;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .btn-small {
            padding: 8px 20px;
            font-size: 0.9rem;
        }
        
        .output-section {
            display: none;
        }
        
        .output-section.active {
            display: block;
        }

        .logs-section {
            display: none;
        }

        .logs-section.active {
            display: block;
        }
        
        .file-list {
            list-style: none;
            margin-top: 15px;
        }
        
        .file-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .file-name {
            font-weight: 600;
            color: #333;
        }
        
        .file-actions {
            display: flex;
            gap: 10px;
        }
        
        .status {
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        /* XML Viewer Styles */
        .xml-viewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            flex-direction: column;
        }
        
        .xml-viewer.active {
            display: flex;
        }
        
        .xml-viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #667eea;
            color: white;
            padding: 15px 20px;
            border-bottom: 2px solid #764ba2;
        }
        
        .xml-viewer-content {
            flex: 1;
            background: #ffffff;
            color: #333;
            padding: 30px;
            overflow: auto;
            font-family: 'Courier New', 'Monaco', monospace;
            font-size: 14px;
            line-height: 1.8;
            border: 1px solid #e0e0e0;
        }
        
        .xml-viewer-content pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-family: 'Courier New', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.7;
            color: #1a1a1a;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .logs-viewer {
            background: #111827;
            color: #e5eefc;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 360px;
            overflow: auto;
        }

        .logs-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .logs-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .logs-tab {
            padding: 8px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #f8fafc;
            color: #334155;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .logs-tab.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SEPA Request Generator</h1>
            <p>Convert payment files to SEPA XML format</p>
        </div>
        
        <div class="card">
            <h2 class="card-title">Process Payment File</h2>

            <div class="form-group">
                <label>Select File from Desktop</label>
                <div style="border: 2px dashed #667eea; padding: 20px; border-radius: 8px; text-align: center; cursor: pointer;" onclick="document.getElementById('fileInput').click()">
                    <p id="fileNameDisplay">Click to browse and choose a file</p>
                    <p style="font-size: 0.8rem; color: #888; margin-top: 5px;">Support for .xlsx, .xls, .csv, .txt</p>
                    <input type="file" id="fileInput" style="display: none;" onchange="handleFileSelect(event)" accept=".xlsx,.xls,.csv,.txt">
                </div>
            </div>
            
            <button class="btn btn-primary" id="processBtn">Process & Generate SEPA</button>
            
            <div id="status" class="status" style="display: none;"></div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing file...</p>
        </div>
        
        <div class="card output-section" id="outputSection">
            <h2 class="card-title">Generated Output Files</h2>
            <ul class="file-list" id="outputFiles"></ul>
        </div>

        <div class="card logs-section" id="logsSection">
            <h2 class="card-title">Processing Logs</h2>
            <div class="logs-toolbar">
                <div class="logs-tabs">
                    <button class="logs-tab active" id="runLogsTab" onclick="setLogsTab('run')">Current Run Logs</button>
                    <button class="logs-tab" id="completeLogsTab" onclick="setLogsTab('complete')">Complete Logs</button>
                </div>
                <button class="btn btn-secondary btn-small" onclick="downloadLogs()">Download Logs</button>
            </div>
            <div class="logs-viewer" id="logsViewer">No logs yet.</div>
        </div>
    </div>
    
    <!-- XML Viewer Modal -->
    <div class="xml-viewer" id="xmlViewer">
        <div class="xml-viewer-header">
            <h3 id="xmlViewerTitle">XML Viewer</h3>
            <div>
                <button class="btn btn-secondary btn-small" onclick="toggleFullscreen()">Fullscreen</button>
                <button class="btn btn-secondary btn-small" onclick="closeXmlViewer()">Close</button>
            </div>
        </div>
        <div class="xml-viewer-content" id="xmlViewerContent"></div>
    </div>

    <script>
        let selectedLocalFile = null;
        let currentRunLogs = '';
        let completeLogs = '';
        let activeLogsTab = 'run';
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('processBtn').addEventListener('click', processRequest);
            loadCompleteLogs();
        });

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                selectedLocalFile = file;
                document.getElementById('fileNameDisplay').textContent = "Selected: " + file.name;
                document.getElementById('fileNameDisplay').style.color = "#667eea";
                document.getElementById('fileNameDisplay').style.fontWeight = "bold";
            }
        }
        
        function processRequest() {
            processLocalFile();
        }

        function processLocalFile() {
            if (!selectedLocalFile) {
                showStatus('Please choose a file from your desktop', 'error');
                return;
            }
            
            document.getElementById('loading').classList.add('active');
            document.getElementById('outputSection').classList.remove('active');
            
            const formData = new FormData();
            formData.append('file', selectedLocalFile);
            
            fetch('/api/sepa/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(handleProcessResponse)
            .catch(handleProcessError);
        }

        function handleProcessResponse(data) {
            document.getElementById('loading').classList.remove('active');
            if (data.success) {
                showStatus(data.message, 'success');
                displayOutputFiles(data.generatedFiles);
                currentRunLogs = data.logs || '';
                displayLogs();
                loadCompleteLogs();
            } else {
                showStatus(data.message, 'error');
                currentRunLogs = data.logs || '';
                displayLogs();
                loadCompleteLogs();
            }
        }

        function handleProcessError(error) {
            document.getElementById('loading').classList.remove('active');
            showStatus('Error processing: ' + error.message, 'error');
            currentRunLogs = 'Error processing: ' + error.message;
            displayLogs();
        }
        
        function displayOutputFiles(files) {
            const outputSection = document.getElementById('outputSection');
            const outputFiles = document.getElementById('outputFiles');
            
            outputFiles.innerHTML = '';
            
            if (files && files.length > 0) {
                files.forEach(file => {
                    const li = document.createElement('li');
                    li.className = 'file-item';
                    li.innerHTML = `
                        <span class="file-name">${file}</span>
                        <div class="file-actions">
                            <button class="btn btn-primary btn-small" onclick="viewFile('${file}')">View</button>
                            <a href="/api/sepa/download/${encodeURIComponent(file)}" class="btn btn-secondary btn-small" style="text-decoration: none;">Download</a>
                        </div>
                    `;
                    outputFiles.appendChild(li);
                });
                outputSection.classList.add('active');
            } else {
                outputFiles.innerHTML = '<li class="file-item"><span class="file-name">No output files generated</span></li>';
                outputSection.classList.add('active');
            }
        }

        function displayLogs() {
            const logsSection = document.getElementById('logsSection');
            const logsViewer = document.getElementById('logsViewer');
            const logText = activeLogsTab === 'complete' ? completeLogs : currentRunLogs;
            logsViewer.textContent = logText && logText.trim().length > 0 ? logText : 'No logs yet.';
            logsSection.classList.add('active');
        }

        function setLogsTab(tab) {
            activeLogsTab = tab;
            document.getElementById('runLogsTab').classList.toggle('active', tab === 'run');
            document.getElementById('completeLogsTab').classList.toggle('active', tab === 'complete');
            displayLogs();
        }

        function loadCompleteLogs() {
            fetch('/api/sepa/logs?scope=complete')
                .then(response => response.json())
                .then(data => {
                    completeLogs = data.logs || '';
                    if (activeLogsTab === 'complete') {
                        displayLogs();
                    }
                })
                .catch(() => {
                    if (!completeLogs) {
                        completeLogs = 'Unable to load complete logs.';
                    }
                });
        }

        function downloadLogs() {
            window.location.href = '/api/sepa/logs/download?scope=' + encodeURIComponent(activeLogsTab);
        }
        
        function viewFile(filename) {
            fetch('/api/sepa/download/' + encodeURIComponent(filename))
                .then(response => response.text())
                .then(content => {
                    document.getElementById('xmlViewerTitle').textContent = filename;
                    const viewerContent = document.getElementById('xmlViewerContent');
                    
                    // Format XML with proper indentation for better visibility
                    let formattedContent = content;
                    if (filename.toLowerCase().endsWith('.xml')) {
                        formattedContent = formatXmlContent(content);
                    }
                    
                    viewerContent.innerHTML = '<pre>' + escapeHtml(formattedContent) + '</pre>';
                    document.getElementById('xmlViewer').classList.add('active');
                })
                .catch(error => {
                    showStatus('Error viewing file: ' + error.message, 'error');
                });
        }
        
        function formatXmlContent(xml) {
            let formatted = '';
            let indent = 0;
            let lines = xml.split(/>\s*</);
            
            lines.forEach((line, index) => {
                let node = line;
                if (index > 0) node = '<' + node;
                if (index < lines.length - 1) node = node + '>';
                
                // Check if it's a closing tag
                if (node.match(/^<\//)) {
                    indent = Math.max(0, indent - 1);
                }
                
                formatted += '  '.repeat(indent) + node + '\n';
                
                // Check if it's an opening tag (not self-closing)
                if (node.match(/^<[^/!?][^>]*[^/]>$/)) {
                    indent++;
                }
            });
            
            return formatted;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function closeXmlViewer() {
            document.getElementById('xmlViewer').classList.remove('active');
            if (document.fullscreenElement) {
                document.exitFullscreen();
            }
        }
        
        function toggleFullscreen() {
            const viewer = document.getElementById('xmlViewer');
            if (!document.fullscreenElement) {
                viewer.requestFullscreen().catch(err => {
                    showStatus('Error entering fullscreen: ' + err.message, 'error');
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }
    </script>
</body>
</html>
